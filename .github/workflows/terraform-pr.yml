name: Terraform PR Validation

on:
  pull_request:
    branches: [ main, master ]
    paths:
      - '**.tf'
      - '**.tfvars'
      - '.github/workflows/terraform-pr.yml'

jobs:
  terraform-validate-plan:
    name: Terraform Validate and Plan
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pull-requests: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ~1.0
        
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
        
    - name: Terraform Init
      run: terraform init
      
    - name: Terraform Format Check
      run: terraform fmt -check -recursive
      continue-on-error: true
      
    - name: Terraform Validate
      run: terraform validate
      
    - name: Terraform Plan
      id: plan
      run: |
        terraform plan \
          -var="aws_region=${{ vars.TF_VAR_AWS_REGION }}" \
          -var="environment=${{ vars.TF_VAR_ENVIRONMENT }}" \
          -var="project_name=${{ vars.TF_VAR_PROJECT_NAME }}" \
          -var="vpc_cidr=${{ vars.TF_VAR_VPC_CIDR }}" \
          -var="public_subnets=${{ vars.TF_VAR_PUBLIC_SUBNETS }}" \
          -var="private_subnets=${{ vars.TF_VAR_PRIVATE_SUBNETS }}" \
          -var="database_subnets=${{ vars.TF_VAR_DATABASE_SUBNETS }}" \
          -no-color -out=tfplan
        terraform show -no-color tfplan > plan_output.txt
      continue-on-error: true
      
    - name: Comment PR with Plan
      uses: actions/github-script@v7
      if: github.event_name == 'pull_request'
      with:
        script: |
          const fs = require('fs');
          const plan = fs.readFileSync('plan_output.txt', 'utf8');
          const maxLength = 65000; // GitHub comment limit
          const truncatedPlan = plan.length > maxLength ? 
            plan.substring(0, maxLength) + '\n\n... (output truncated)' : 
            plan;
            
          const output = `## 🏗️ Terraform Plan
          
          <details>
          <summary>📋 Plan Output</summary>
          
          \`\`\`hcl
          ${truncatedPlan}
          \`\`\`
          
          </details>
          
          **Plan Status:** ${{ steps.plan.outcome }}
          
          *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: output
          });
          
    - name: Terraform Plan Status
      if: steps.plan.outcome == 'failure'
      run: exit 1
